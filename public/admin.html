<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #eef2ff; --bg2: #fdf2f8; --ink: #0f172a; --muted: #64748b;
    --accent: #6366f1; --accent-2: #8b5cf6; --ok: #10b981; --bad: #ef4444;
    --glass: rgba(255,255,255,.65); --glass-border: rgba(255,255,255,.9);
    --shadow: 0 8px 32px rgba(99,102,241,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 16px 16px 60px; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 4px 14px; }
  h3 { margin: 18px 4px 10px; font-size: 14px; color: var(--muted); letter-spacing: .3px; }

  .tabs { display: flex; gap: 6px; background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 5px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow); margin-bottom: 14px; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); padding: 10px 4px; font-size: 13px; }
  .tabs button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: rise .4s ease both; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 2px 5px; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 14px; border-radius: 12px; color: var(--ink);
    border: 1px solid rgba(15,23,42,.08); background: #fff; outline: none; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; }

  button { border: 0; border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform .15s ease, opacity .2s ease; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; width: 100%; margin-top: 14px; }
  .small { padding: 8px 12px; font-size: 12px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.07); color: var(--ink); }
  .small.bad { color: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .off { opacity: .55; }
  .hide { display: none; }
  .msg { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: var(--ink);
    color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .3s ease; max-width: 88%; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>👑 Admin Panel</h1>

  <div class="tabs" id="tabs">
    <button data-tab="stats" class="on">Stats</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="users">Users</button>
    <button data-tab="bc">Broadcast</button>
  </div>

  <!-- STATS -->
  <section id="tab-stats">
    <div class="grid" id="statsGrid"><div class="msg" style="grid-column:1/3">Loading...</div></div>
    <div class="card meta">Pending proof ar withdraw bot chat e Approve / Paid button soho ashe. Miss hole bot e <b>/pending</b> likho.</div>
  </section>

  <!-- TASKS -->
  <section id="tab-tasks" class="hide">
    <h3>NOTUN TASK</h3>
    <div class="card">
      <label>Type</label>
      <select id="tType">
        <option value="telegram_join">📢 Telegram channel join (auto verify)</option>
        <option value="timer">🎬 Timer: ad / link dekha (auto)</option>
        <option value="proof">▶️ Proof: YouTube subscribe (screenshot)</option>
      </select>
      <label>Title</label><input id="tTitle" maxlength="100" placeholder="Task er nam">
      <label>Description</label><input id="tDesc" maxlength="200" placeholder="Choto bornona">
      <label>Reward (৳)</label><input id="tReward" type="number" inputmode="decimal" step="0.01" placeholder="2">
      <div id="fChannel"><label>Channel username (@name)</label><input id="tChannel" placeholder="@Shakil_X9X"></div>
      <div id="fUrl" class="hide"><label>Link (https://...)</label><input id="tUrl" placeholder="https://..."></div>
      <div id="fSecs" class="hide"><label>Koto second thakte hobe</label><input id="tSecs" type="number" inputmode="numeric" value="15"></div>
      <label>Order (choto number age dekhabe)</label><input id="tOrder" type="number" inputmode="numeric" placeholder="10">
      <button class="primary" id="addTask">Task add koro</button>
    </div>
    <h3>SHOB TASK</h3>
    <div id="taskList"></div>
  </section>

  <!-- USERS -->
  <section id="tab-users" class="hide">
    <h3>USER KHUJUN</h3>
    <div class="card">
      <label>Telegram ID ba @username</label>
      <input id="uQuery" placeholder="8361587941">
      <button class="primary" id="uSearch">Search</button>
    </div>
    <div id="userBox"></div>
  </section>

  <!-- BROADCAST -->
  <section id="tab-bc" class="hide">
    <h3>SOB USER KE MESSAGE</h3>
    <div class="card">
      <label>Message (plain text)</label>
      <textarea id="bcText" maxlength="3500" placeholder="Notun task add hoyeche!"></textarea>
      <button class="primary" id="bcSend">Send to all</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';
const $ = (id) => document.getElementById(id);
const money = (n) => '৳' + Number(n || 0).toFixed(2);
const TYPE_LABEL = { telegram_join: '📢 Join', timer: '🎬 Timer', proof: '▶️ Proof' };

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(path, method = 'GET', body) {
  const r = await fetch('/api/admin' + path, {
    method,
    headers: { 'X-Init-Data': initData, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- tabs ---------- */
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['stats', 'tasks', 'users', 'bc'].forEach((k) => $('tab-' + k).classList.toggle('hide', k !== b.dataset.tab));
  if (b.dataset.tab === 'stats') loadStats();
  if (b.dataset.tab === 'tasks') loadTasks();
});

/* ---------- stats ---------- */
async function loadStats() {
  try {
    const s = await api('/stats');
    const items = [
      [s.users, 'Total users'], [s.verified, 'Verified users'],
      [s.pendingProofs, 'Pending proofs'], [s.pendingWithdrawals, 'Pending withdraws'],
      [s.paidCount, 'Paid withdraws'], [money(s.paidTotal), 'Total paid'],
    ];
    const g = $('statsGrid'); g.innerHTML = '';
    items.forEach(([n, l]) => {
      const c = el('div', 'card stat'); c.append(el('div', 'n', String(n)), el('div', 'l', l)); g.append(c);
    });
  } catch (e) {
    $('statsGrid').innerHTML = '';
    const m = el('div', 'msg', initData ? e.message : 'Bot er /admin button theke open korun');
    m.style.gridColumn = '1/3'; $('statsGrid').append(m);
  }
}

/* ---------- tasks ---------- */
function syncFields() {
  const t = $('tType').value;
  $('fChannel').classList.toggle('hide', t !== 'telegram_join');
  $('fUrl').classList.toggle('hide', t === 'telegram_join');
  $('fSecs').classList.toggle('hide', t !== 'timer');
}
$('tType').addEventListener('change', syncFields);

$('addTask').addEventListener('click', async () => {
  const b = $('addTask'); b.disabled = true;
  try {
    await api('/tasks', 'POST', {
      type: $('tType').value, title: $('tTitle').value, description: $('tDesc').value,
      reward: $('tReward').value, channel: $('tChannel').value, url: $('tUrl').value,
      seconds: $('tSecs').value, order: $('tOrder').value,
    });
    ['tTitle', 'tDesc', 'tReward', 'tChannel', 'tUrl', 'tOrder'].forEach((i) => { $(i).value = ''; });
    toast('✅ Task add hoyeche');
    loadTasks();
  } catch (e) { toast(e.message); }
  b.disabled = false;
});

async function loadTasks() {
  const box = $('taskList');
  try {
    const { tasks } = await api('/tasks');
    box.innerHTML = '';
    if (!tasks.length) { box.append(el('div', 'msg', 'Kono task nai')); return; }
    tasks.forEach((t) => {
      const card = el('div', 'card' + (t.active ? '' : ' off'));
      const row = el('div', 'row');
      const info = el('div', 'grow');
      info.append(
        el('div', 'title', t.title),
        el('div', 'meta', `${TYPE_LABEL[t.type] || t.type} · ${money(t.reward)} · order ${t.order || 0}` +
          (t.seconds ? ` · ${t.seconds}s` : '') + (t.active ? '' : ' · OFF'))
      );
      const tog = el('button', 'small', t.active ? 'Off' : 'On');
      tog.onclick = async () => { try { await api(`/tasks/${t.id}/toggle`, 'POST'); loadTasks(); } catch (e) { toast(e.message); } };
      const del = el('button', 'small bad', 'Delete');
      del.onclick = async () => {
        if (!confirm('Task ta delete korben?')) return;
        try { await api(`/tasks/${t.id}`, 'DELETE'); loadTasks(); } catch (e) { toast(e.message); }
      };
      row.append(info, tog, del); card.append(row); box.append(card);
    });
  } catch (e) { box.innerHTML = ''; box.append(el('div', 'msg', e.message)); }
}

/* ---------- users ---------- */
async function searchUser() {
  const box = $('userBox'); box.innerHTML = '';
  try {
    const { user: u } = await api('/user?q=' + encodeURIComponent($('uQuery').value));
    const card = el('div', 'card');
    card.append(
      el('div', 'title', `${u.name || 'No name'}${u.username ? ' (@' + u.username + ')' : ''}`),
      el('div', 'meta', `ID: ${u.tgId}`),
      el('div', 'meta', `Balance: ${money(u.balance)} · Earned: ${money(u.totalEarned)}`),
      el('div', 'meta', `Refers: ${u.refCount || 0} · Verified: ${u.verified ? 'Yes' : 'No'} · ${u.banned ? '🚫 BANNED' : 'Active'}`)
    );
    const ban = el('button', 'small ' + (u.banned ? '' : 'bad'), u.banned ? 'Unban' : 'Ban');
    ban.style.marginTop = '12px';
    ban.onclick = async () => {
      try { await api(`/user/${u.tgId}/ban`, 'POST', { banned: !u.banned }); toast('Done'); searchUser(); }
      catch (e) { toast(e.message); }
    };
    const lab = el('label', '', 'Balance adjust (+ ba -)');
    const inp = el('input'); inp.type = 'number'; inp.step = '0.01'; inp.placeholder = '+10 ba -5';
    inp.setAttribute('inputmode', 'decimal');
    const go = el('button', 'primary', 'Balance update');
    go.onclick = async () => {
      try {
        const r = await api(`/user/${u.tgId}/balance`, 'POST', { amount: inp.value });
        toast('✅ New balance ' + money(r.balance)); searchUser();
      } catch (e) { toast(e.message); }
    };
    card.append(ban, lab, inp, go); box.append(card);
  } catch (e) { box.append(el('div', 'msg', e.message)); }
}
$('uSearch').addEventListener('click', searchUser);

/* ---------- broadcast ---------- */
$('bcSend').addEventListener('click', async () => {
  const text = $('bcText').value.trim();
  if (!text) return toast('Message likhun');
  if (!confirm('Sob user ke pathate chan?')) return;
  const b = $('bcSend'); b.disabled = true;
  try {
    const r = await api('/broadcast', 'POST', { text });
    toast(`📢 ${r.total} jon ke pathano shuru hoyeche`);
    $('bcText').value = '';
  } catch (e) { toast(e.message); }
  b.disabled = false;
});

syncFields();
loadStats();
</script>
</body>
</html>
